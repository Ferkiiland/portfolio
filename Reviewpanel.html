<body>

<div class="card">
    <div id="key-section">
        <label>Enter Your Order Key</label>
        <input type="text" id="orderKey" placeholder="e.g. df5e8ba1">
        <button id="checkKeyBtn">Check Key</button>
        <div id="keyError" style="color:red; margin-top:5px;"></div>
    </div>

    <div id="review-form" style="display:none;">
        <label>Username</label>
        <input type="text" id="username" readonly="">

        <label>Order Title</label>
        <input type="text" id="orderTitle" readonly="">

        <label>Category</label>
        <input type="text" id="category" readonly="">

        <label>Rating</label>
        <div class="star-rating" id="starRating">
            <svg class="star" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16,14 18,22 12,17 6,22 8,14 2,9 9,9"></polygon></svg>
            <svg class="star" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16,14 18,22 12,17 6,22 8,14 2,9 9,9"></polygon></svg>
            <svg class="star" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16,14 18,22 12,17 6,22 8,14 2,9 9,9"></polygon></svg>
            <svg class="star" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16,14 18,22 12,17 6,22 8,14 2,9 9,9"></polygon></svg>
            <svg class="star" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16,14 18,22 12,17 6,22 8,14 2,9 9,9"></polygon></svg>
        </div>

        <label>Comment</label>
        <textarea id="comment" rows="4" maxlength="120" placeholder="Write your review..."></textarea>
        <div class="char-counter" id="charCounter">0/120</div>

        <button id="sendBtn">Send Review</button>
    </div>
</div>

<script>
let orders = [];
let selectedRating = 0;


fetch('https://ferkii.com/active-orders.json')
  .then(res => res.json())
  .then(data => { orders = data; })
  .catch(err => {
      console.error("Error loading orders from main site:", err);
      // Intentar cargar desde local
      fetch('./active-orders.json')
          .then(res => res.json())
          .then(data => { orders = data; })
          .catch(err2 => console.error("Error loading from local:", err2));
  });

const orderKeyInput = document.getElementById('orderKey');
const checkKeyBtn = document.getElementById('checkKeyBtn');
const keyError = document.getElementById('keyError');
const reviewForm = document.getElementById('review-form');
const card = document.querySelector('.card');
const body = document.body;


let mouseX = 0;
let mouseY = 0;
let parallaxStrength = 20; 
let cardParallaxStrength = 8; 


document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    

    const xPercent = mouseX / window.innerWidth;
    const yPercent = mouseY / window.innerHeight;
    

    const bgX = (xPercent - 0.5) * parallaxStrength;
    const bgY = (yPercent - 0.5) * parallaxStrength;
    
    body.style.backgroundPosition = `calc(50% + ${bgX}px) calc(50% + ${bgY}px)`;
    

    const cardX = (xPercent - 0.5) * cardParallaxStrength;
    const cardY = (yPercent - 0.5) * cardParallaxStrength;
    card.style.transform = `translate(${cardX}px, ${cardY}px)`;
});


document.addEventListener('mouseleave', () => {
    body.style.backgroundPosition = 'center center';
    card.style.transform = 'translate(0, 0)';
});


function initTouchParallax() {
    document.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
            const touch = e.touches[0];
            mouseX = touch.clientX;
            mouseY = touch.clientY;
            
            const xPercent = mouseX / window.innerWidth;
            const yPercent = mouseY / window.innerHeight;
            
            const bgX = (xPercent - 0.5) * parallaxStrength;
            const bgY = (yPercent - 0.5) * parallaxStrength;
            
            body.style.backgroundPosition = `calc(50% + ${bgX}px) calc(50% + ${bgY}px)`;
            
            const cardX = (xPercent - 0.5) * cardParallaxStrength;
            const cardY = (yPercent - 0.5) * cardParallaxStrength;
            card.style.transform = `translate(${cardX}px, ${cardY}px)`;
        }
    }, { passive: true });
    
    document.addEventListener('touchend', () => {
        setTimeout(() => {
            body.style.backgroundPosition = 'center center';
            card.style.transform = 'translate(0, 0)';
        }, 500);
    });
}


if ('ontouchstart' in window) {
    initTouchParallax();
}


checkKeyBtn.addEventListener('click', () => {
    const key = orderKeyInput.value.trim();
    const order = orders.find(o => o.key === key);
    if (!order) {
        keyError.textContent = "The key does not match any active order. Please check with Ferkii.";
        return;
    }
    keyError.textContent = "";
    document.getElementById('username').value = order.userName;
    document.getElementById('orderTitle').value = order.title;
    document.getElementById('category').value = order.category;
    document.getElementById('key-section').style.display = 'none';
    reviewForm.style.display = 'block';
});


const stars = document.querySelectorAll('.star');
stars.forEach((star, index) => {
    star.addEventListener('click', () => {
        selectedRating = index + 1;
        updateStars();
    });
});
function updateStars() {
    stars.forEach((star, index) => {
        if (index < selectedRating) star.classList.add('filled');
        else star.classList.remove('filled');
    });
}


const commentInput = document.getElementById('comment');
const charCounter = document.getElementById('charCounter');
commentInput.addEventListener('input', () => {
    const len = commentInput.value.length;
    const diff = 120 - len;
    charCounter.textContent = diff >= 0 ? `${len}/120` : `-${-diff} over limit`;
    charCounter.classList.toggle('over', diff < 0);
});


document.getElementById('sendBtn').addEventListener('click', async () => {
    const username = document.getElementById('username').value;
    const title = document.getElementById('orderTitle').value;
    const category = document.getElementById('category').value;
    const comment = commentInput.value.trim();

    if (selectedRating === 0) { 
        alert("Please select a rating."); 
        return; 
    }
    if (!comment) { 
        alert("Please enter a comment."); 
        return; 
    }


    const formData = new FormData();
    formData.append('username', username);
    formData.append('title', title);
    formData.append('category', category);
    formData.append('comment', comment);
    formData.append('rating', selectedRating);

    try {
        const response = await fetch('https://bau37rjl.tunnelite.com/review', {
            method: 'POST',
            body: new URLSearchParams({
                username: username,
                title: title,
                category: category,
                comment: comment,
                rating: selectedRating
            }),
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            }
        });

        const result = await response.json();
        console.log('Server response:', result);

        if (response.ok && result.success) {
            alert("✅ Review sent successfully!");

            commentInput.value = '';
            selectedRating = 0;
            updateStars();
            charCounter.textContent = "0/120";

            document.getElementById('key-section').style.display = 'flex';
            reviewForm.style.display = 'none';
            orderKeyInput.value = '';
        } else {
            alert("❌ Error: " + (result.error || 'Unknown error'));
        }
    } catch (err) {
        console.error('Connection error:', err);
        alert("❌ Connection error. Please try again later.");
    }
});
</script>

</body>
</html>
