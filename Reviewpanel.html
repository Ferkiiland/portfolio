<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dejar una Review</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            padding: 20px;
        }
        .card {
            max-width: 450px;
            margin: auto;
            padding: 20px;
            background: #222;
            border-radius: 10px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
        }
        button {
            margin-top: 15px;
            padding: 12px;
            background: #5865f2;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #4754d4; }
    </style>
</head>
<body>

<div class="card">
    <h2>Deja tu Review ✨</h2>

    <label>Tu nombre</label>
    <input id="name" type="text" placeholder="Escribe tu nombre">

    <label>Tu review</label>
    <textarea id="review" rows="5" placeholder="Escribe tu experiencia..."></textarea>

    <button id="sendBtn">Enviar</button>
</div>

<script>
document.getElementById('sendBtn').addEventListener('click', async () => {
    const name = document.getElementById("name").value.trim();
    const comment = document.getElementById("review").value.trim();

    if (!name || !comment) {
        alert("Por favor completa nombre y review.");
        return;
    }

    try {
        const response = await fetch('https://dpjczb59.tunnelite.com/review', {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name,
                comment,
                rating: 5
            })
        });

        if (response.ok) {
            alert("¡Gracias! Tu review fue enviada.");
            document.getElementById("name").value = "";
            document.getElementById("review").value = "";
        } else {
            console.error("Error en la respuesta:", response.status, await response.text());
            alert("Hubo un problema al enviar tu review. Intenta más tarde.");
        }
    } catch (err) {
        console.error("Error de conexión:", err);
        alert("Error de conexión. Intenta más tarde.");
    }
});
</script>

</body>
</html>
