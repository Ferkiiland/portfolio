<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dejar una Review</title>
</head>
<body>
    <h2>Deja tu Review</h2>

    <form id="reviewForm">
        <input type="text" id="nombre" placeholder="Tu nombre" required><br><br>
        <textarea id="mensaje" placeholder="Tu review" required></textarea><br><br>
        <button type="submit">Enviar</button>
    </form>

    <script>
        document.getElementById("reviewForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const data = {
                nombre: document.getElementById("nombre").value,
                mensaje: document.getElementById("mensaje").value,
            };

            const response = await fetch("TU_TUNEL_PUBLICO/review", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            alert(result.message);
        });
    </script>
</body>
</html>
