<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dejar una Review</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            padding: 20px;
        }
        .card {
            max-width: 450px;
            margin: auto;
            padding: 20px;
            background: #222;
            border-radius: 10px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            margin-top: 15px;
            padding: 12px;
            background: #5865f2;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #4754d4; }
    </style>
</head>
<body>

<div class="card">
    <h2>Deja tu Review ✨</h2>

    <label>Tu nombre</label>
    <input id="name" type="text" placeholder="Escribe tu nombre">

    <label>Tu Discord (opcional)</label>
    <input id="discord" type="text" placeholder="usuario#0000">

    <label>Puntaje (1-5)</label>
    <input id="rating" type="number" min="1" max="5" placeholder="5">

    <label>Tu review</label>
    <textarea id="comment" rows="5" placeholder="Escribe tu experiencia..."></textarea>

    <button onclick="sendReview()">Enviar</button>
</div>

<script>
async function sendReview() {
    const name = document.getElementById("name").value.trim();
    const discord = document.getElementById("discord").value.trim(); // opcional
    const rating = parseInt(document.getElementById("rating").value);
    const comment = document.getElementById("comment").value.trim();

    if (!name || !rating || !comment) {
        alert("Por favor completa nombre, puntaje y review.");
        return;
    }

    try {
        const response = await fetch("https://dpjczb59.tunnelite.com/review", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, rating, comment, discord })
        });

        const data = await response.json();

        if (data.success) {
            alert("¡Gracias! Tu review fue enviada.");
            location.reload();
        } else {
            alert("Hubo un problema al enviar tu review: " + data.message);
        }
    } catch (err) {
        console.error(err);
        alert("Error de conexión. Intenta más tarde.");
    }
}
</script>

</body>
</html>
